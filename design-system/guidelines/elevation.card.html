<!-- @dsCard group="Layout" viewport="700x210" subtitle="Nodes float just above the canvas - crisp box, faint throw" name="Elevation &amp; stacking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;font-size:var(--text-sm)}.lbl{font-size:var(--text-2xs);margin-top:4px;display:block}.mono{font-family:var(--font-mono);font-size:var(--text-2xs)}.note{font-size:var(--text-xs);margin:12px 0 0}</style></head><body><div style="display:flex;gap:14px;align-items:flex-start"><div style="flex:1"><div class="elev-sm" style="height:52px;background:var(--color-bg);border:1px solid var(--color-divider)"></div><span class="lbl mono text-muted">--shadow-sm</span></div><div style="flex:1"><div class="elev-md" style="height:52px;background:var(--color-bg);border:1px solid var(--color-divider)"></div><span class="lbl mono text-muted">--shadow-md</span></div><div style="flex:1"><div class="elev-lg" style="height:52px;background:var(--color-bg);border:1px solid var(--color-divider)"></div><span class="lbl mono text-muted">--shadow-lg</span></div><div style="flex:1"><div style="height:52px;background:var(--node-fill);border:1px solid var(--node-border);box-shadow:var(--shadow-node)"></div><span class="lbl mono text-muted">--shadow-node</span></div></div><p class="note text-muted">Stacking is a token scale, not DOM order: <span class="mono">--z-canvas 0 &middot; --z-edge 10 &middot; --z-node 20 &middot; --z-node-active 30 &middot; --z-overlay 100 &middot; --z-panel 200 &middot; --z-dialog 1000</span>.</p></body></html>
