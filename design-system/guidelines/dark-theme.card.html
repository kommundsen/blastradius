<!-- @dsCard group="Colors" viewport="700x230" subtitle="Follows the OS; data-theme pins a subtree either way" name="Dark theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;font-size:var(--text-sm)}.lbl{font-size:var(--text-2xs);margin-top:4px;display:block}.mono{font-family:var(--font-mono);font-size:var(--text-2xs)}.note{font-size:var(--text-xs);margin:12px 0 0}</style></head><body><div style="display:flex;gap:14px"><div data-theme="light" style="flex:1;padding:12px;background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-divider)"><div style="font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:var(--text-md)">Light</div><div style="display:flex;gap:6px;margin:8px 0"><button class="btn btn-primary">Share</button><button class="btn btn-secondary">History</button></div><span class="mono text-muted">[data-theme="light"]</span></div><div data-theme="dark" style="flex:1;padding:12px;background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-divider)"><div style="font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:var(--text-md)">Dark</div><div style="display:flex;gap:6px;margin:8px 0"><button class="btn btn-primary">Share</button><button class="btn btn-secondary">History</button></div><span class="mono text-muted">[data-theme="dark"]</span></div></div><p class="note text-muted">Default is the OS preference. <span class="mono">data-theme</span> pins a subtree in <b style="font-weight:500">either</b> direction, so a light export preview can live inside a dark app. The previous dark-only override had no way back.</p></body></html>
