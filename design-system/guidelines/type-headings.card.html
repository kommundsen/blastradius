<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;font-size:var(--text-sm)}.lbl{font-size:var(--text-2xs);margin-top:4px;display:block}.mono{font-family:var(--font-mono);font-size:var(--text-2xs)}.note{font-size:var(--text-xs);margin:12px 0 0}</style></head><body><div style="font-family:var(--font-heading);font-weight:600;letter-spacing:var(--tracking-heading);line-height:var(--leading-heading)"><div style="font-size:var(--text-3xl);text-transform:uppercase">Your architecture</div><div style="font-size:var(--text-2xl);text-transform:uppercase">at every altitude</div><div style="font-size:var(--text-xl)">Containers, components, code</div></div><p class="note text-muted">Three tracking tokens replace five ad-hoc values: <span class="mono">--tracking-heading</span> (-.015em, large condensed), <span class="mono">--tracking-label</span> (.1em, uppercase micro-labels), <span class="mono">--tracking-wide</span> (.04em, wordmark and edge labels).</p></body></html>
