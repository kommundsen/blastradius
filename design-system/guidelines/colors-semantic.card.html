<!-- @dsCard group="Colors" viewport="700x150" subtitle="The app layer speaks aliases, never a hex" name="Canvas &amp; node aliases" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;font-size:var(--text-sm)}.lbl{font-size:var(--text-2xs);margin-top:4px;display:block}.mono{font-family:var(--font-mono);font-size:var(--text-2xs)}.note{font-size:var(--text-xs);margin:12px 0 0}</style></head><body><div style="display:flex;gap:6px"><div style="flex:1;min-width:0"><div style="height:44px;background:var(--node-fill);border:1px solid var(--color-divider);"></div><span class="lbl"><b style="font-weight:500">node-fill</b><br><span class="mono text-muted">--node-fill</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--node-fill-active);border:1px solid var(--color-divider);"></div><span class="lbl"><b style="font-weight:500">node-active</b><br><span class="mono text-muted">--node-fill-active</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--node-border);"></div><span class="lbl"><b style="font-weight:500">node-border</b><br><span class="mono text-muted">--node-border</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--edge-stroke);"></div><span class="lbl"><b style="font-weight:500">edge</b><br><span class="mono text-muted">--edge-stroke</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--code-bg);border:1px solid var(--color-divider);"></div><span class="lbl"><b style="font-weight:500">code-bg</b><br><span class="mono text-muted">--code-bg</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--code-key);"></div><span class="lbl"><b style="font-weight:500">code-key</b><br><span class="mono text-muted">--code-key</span></span></div><div style="flex:1;min-width:0"><div style="height:44px;background:var(--code-highlight);border:1px solid var(--color-divider);"></div><span class="lbl"><b style="font-weight:500">code-hl</b><br><span class="mono text-muted">--code-highlight</span></span></div></div><p class="note text-muted">Aliases remap under <span class="mono">[data-theme]</span> and under the OS preference. Components never hard-code a hex.</p></body></html>
