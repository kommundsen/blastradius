<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;font-size:var(--text-sm)}.lbl{font-size:var(--text-2xs);margin-top:4px;display:block}.mono{font-family:var(--font-mono);font-size:var(--text-2xs)}.note{font-size:var(--text-xs);margin:12px 0 0}</style></head><body><div style="display:flex;gap:24px;padding:8px"><div class="card blueprint" style="flex:1"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><span class="card-kicker">Container</span><span class="card-title">API Application</span><p class="card-body">Transparent line drawing - no surface fill.</p></div><p class="note text-muted" style="flex:1;margin:0">The four marks straddle the border at -6px, so no ancestor may clip them. <b style="font-weight:500">Never put <span class="mono">.blueprint</span> and <span class="mono">.duotone</span> on the same element</b> - duotone clips its image, which eats the corners. Wrap instead.</p></div></body></html>
