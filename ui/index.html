<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blastradius</title>
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="vendor/codemirror.min.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/elk.bundled.js" defer></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/codemirror.min.js" defer></script>
<script src="vendor/codemirror-yaml.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app" id="app">

  <header class="app-bar">
    <img src="ds/assets/mark.svg" width="14" height="14" alt="" id="brand-mark">
    <span class="app-bar-title text-muted" id="breadcrumb">Blastradius</span>
    <span class="seg" role="radiogroup" aria-label="Detail level" id="level-seg">
      <label class="seg-opt"><input type="radio" name="lvl" value="L1">L1</label>
      <label class="seg-opt"><input type="radio" name="lvl" value="L2">L2</label>
      <label class="seg-opt"><input type="radio" name="lvl" value="L3">L3</label>
      <label class="seg-opt is-disabled" title="Code level — introspected components (spec/l4-introspection.md); enabled when the model has source-mapped components"><input type="radio" name="lvl" value="L4" disabled>L4</label>
      <label class="seg-opt is-disabled" title="Deployment — where the containers actually run (ADR-0018); enabled when the model declares environments"><input type="radio" name="lvl" value="LD" disabled>D</label>
    </span>
    <span id="git-chips"></span>
    <span id="diag-chips"></span>
    <span class="app-bar-spacer"></span>
    <button class="btn btn-secondary" id="undo-btn" disabled title="Undo (Ctrl+Z)">↶</button>
    <button class="btn btn-secondary" id="redo-btn" disabled title="Redo (Ctrl+Y)">↷</button>
    <button class="btn btn-secondary" id="diff-btn" hidden title="Semantic diff vs base (spec/git-and-diff.md)">Diff</button>
    <button class="btn btn-secondary" id="history-btn" hidden>History</button>
    <button class="btn btn-secondary" id="find-btn" title="Find in the model (Ctrl+K)">Find</button>
    <button class="btn btn-secondary" id="open-btn" title="Open workspace folder (Ctrl+O)">Open</button>
    <button class="btn btn-secondary bar-drop-2" id="theme-btn" title="Theme: follow OS">Theme</button>
    <button class="btn btn-secondary" id="help-btn" title="Help (?)">Help</button>
    <button class="btn btn-primary" id="share-btn">Share</button>
  </header>

  <div class="app-body" data-nav="open" data-side="open">

    <nav class="panel panel-nav">
      <div class="panel-body" id="tree"></div>
      <div class="panel-grip" id="nav-grip" role="separator" aria-orientation="vertical"
           aria-label="Resize navigation panel" tabindex="0"></div>
    </nav>

    <div class="canvas" id="canvas" tabindex="0" aria-label="Model canvas">
      <div class="canvas-camera" id="camera" style="--camera-scale:1">
        <svg class="edge-layer" id="edge-layer" aria-hidden="true">
          <defs>
            <marker id="br-arrow" viewBox="0 0 10 10" refX="9.5" refY="5"
                    markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth">
              <path class="edge-arrow" d="M1.5,1.5 L9,5 L1.5,8.5"/>
            </marker>
          </defs>
          <g id="edges"></g>
        </svg>
        <div id="nodes"></div>
      </div>
      <div class="canvas-overlay">
        <div class="overlay-bl">
          <span class="btn-group">
            <button class="btn" id="zoom-out" aria-label="Zoom out">−</button>
            <button class="btn" id="zoom-reset">100%</button>
            <button class="btn" id="zoom-in" aria-label="Zoom in">+</button>
          </span>
          <button class="btn btn-secondary" id="add-btn" hidden>+ Element</button>
          <span class="tag tag-accent" id="hint">Double-click to dive · Right-click for actions · Esc to rise</span>
        </div>
        <div class="tour" id="tour" hidden></div>
        <div class="canvas-blank" id="canvas-blank" hidden></div>
      </div>
    </div>

    <aside class="panel panel-side">
      <div class="panel-grip" id="side-grip" role="separator" aria-orientation="vertical"
           aria-label="Resize inspector panel" tabindex="0"></div>
      <div class="panel-head">
        <span class="seg" role="radiogroup" aria-label="Panel mode" id="side-mode">
          <label class="seg-opt is-active"><input type="radio" name="sidemode" value="inspect" checked>Inspect</label>
          <label class="seg-opt"><input type="radio" name="sidemode" value="view">View</label>
          <label class="seg-opt"><input type="radio" name="sidemode" value="source">Source</label>
        </span>
        <span class="panel-title" id="side-title"></span>
        <button class="btn btn-ghost" id="side-back" hidden>← back</button>
        <span class="tag tag-accent" id="src-status" hidden style="margin-left:auto">synced</span>
      </div>
      <div class="panel-body" id="side-body">
        <p class="side-empty text-muted">Select an element to inspect it — its
        description, relations, and the documents that govern it.</p>
      </div>
    </aside>

  </div>
</div>
</body>
</html>
