[package]
name = "blastradius-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blastradius model core: workspace loading, schema validation, semantic diff (library-first, per ADR-0005)"

[dependencies]
# Span-aware YAML: every semantic error must carry file + line (spec/model-format.md §6),
# which rules out serde-style deserialization that discards positions.
marked-yaml = "0.8"
# Snapshot output only — YAML parsing stays span-aware, never serde.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read-only repository access (ADR-0007). vendored-libgit2 so a clean machine
# builds without system libgit2; no openssl needed for local-only operations.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# The built-in Rust L4 extractor (ADR-0016): syn is an ordinary library, so
# "spawn the extractor" is a function call. span-locations for declaration lines.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
globset = "0.4"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
