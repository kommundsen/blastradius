[package]
name = "blastradius-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blastradius command-line interface"

[[bin]]
name = "blastradius"
path = "src/main.rs"

[dependencies]
blastradius-core = { path = "../blastradius-core" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
blastradius-core = { path = "../blastradius-core" }
# Manufacturing real merge conflicts for the MCP resolution exit criterion
# (0.3.0 theme 2) — same vendored build the core already carries.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
