# The dogfood gate (docs/prd.md): docs/ must always be a valid Blastradius
# workspace, validated by the real parser (`blastradius validate` — Phase 0
# exit criterion). The Python stand-in this replaced is retired.
name: validate-docs

on:
  push:
  pull_request:

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (unit, seeded-fault, conformance suites)
        run: cargo test --workspace
      - name: Dogfood gate — validate docs/
        run: cargo run -p blastradius-cli -- validate docs
