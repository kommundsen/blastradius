# Release: tag push -> build x64 + arm64 MSIX -> submit to the Microsoft
# Store via the submission API (tools/submit-store.ps1 — msstore-cli can't
# submit prebuilt packages; spec/msix-store-packaging.md, 0.3.0 theme 3).
#
# Needs (owner-configured, see the spec's credentials section):
#   secrets: PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_CLIENT_ID,
#            PARTNER_CENTER_CLIENT_SECRET
#   variables: STORE_PRODUCT_ID  (the app's 9N... Store ID — public, not a secret)
#
# The MSIX artifacts upload before the Store steps run, so a submission
# failure still leaves installable packages on the run.
name: release

on:
  push:
    tags: ["v*"]
  # Dry run: exercises the whole pipeline but leaves the submission as an
  # uncommitted draft in Partner Center (no -Commit).
  workflow_dispatch:

jobs:
  store-submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Tag must match the release version
        shell: pwsh
        run: |
          $manifest = Get-Content packaging\msix\Package.appxmanifest -Raw
          if ($manifest -notmatch 'Version="(\d+\.\d+\.\d+)\.0"') { throw 'manifest version not found' }
          $version = $Matches[1]
          if ('${{ github.event_name }}' -eq 'push' -and "${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match manifest version $version — bump the three version surfaces first (spec/msix-store-packaging.md)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
        id: version

      - name: Install winapp CLI
        shell: pwsh
        run: winget install microsoft.winappcli --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Pack x64 (unsigned, Store signs)
        shell: pwsh
        run: .\tools\pack-msix.ps1

      - name: Pack arm64
        shell: pwsh
        run: .\tools\pack-msix.ps1 -Arch arm64

      - name: Bundle .msixupload (both architectures, one submission)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}.0"
          # A dedicated directory: msstore publish takes --inputDirectory and
          # picks its candidate from it — keep exactly one thing to find.
          New-Item -ItemType Directory upload | Out-Null
          Compress-Archive -Path packaging\msix\*.msix -DestinationPath "upload\Blastradius_$v.zip"
          Rename-Item "upload\Blastradius_$v.zip" "Blastradius_$v.msixupload"

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: msix-packages
          path: |
            packaging/msix/*.msix
            upload/*.msixupload

      - name: Submit to the Store (submission API)
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if ('${{ vars.STORE_PRODUCT_ID }}' -eq '') { throw 'STORE_PRODUCT_ID repository variable is not set (the 9N... Store ID)' }
          $v = "${{ steps.version.outputs.version }}.0"
          $flags = @('-ReplacePending')
          if ('${{ github.event_name }}' -eq 'push') { $flags += '-Commit' }  # dispatch = dry run, draft only
          .\tools\submit-store.ps1 -ProductId '${{ vars.STORE_PRODUCT_ID }}' -UploadZip "upload\Blastradius_$v.msixupload" @flags
