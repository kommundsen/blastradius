# Release: tag push -> build x64 + arm64 MSIX -> submit to the Microsoft
# Store via the submission API (tools/submit-store.ps1 — msstore-cli can't
# submit prebuilt packages; spec/msix-store-packaging.md, 0.3.0 theme 3).
#
# In parallel, portable archives for Windows and Linux are built and attached
# to a GitHub Release (0.5.0 theme 3). They are deliberately independent of the
# Store job: a submission problem must not take down the only download that
# works on a machine without the Store.
#
# Needs (owner-configured, see the spec's credentials section):
#   secrets: PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_CLIENT_ID,
#            PARTNER_CENTER_CLIENT_SECRET
#   variables: STORE_PRODUCT_ID  (the app's 9N... Store ID — public, not a secret)
#
# The MSIX artifacts upload before the Store steps run, so a submission
# failure still leaves installable packages on the run.
name: release

permissions:
  contents: write   # the portable archives are attached to a Release

on:
  push:
    tags: ["v*"]
  # Dry run: exercises the whole pipeline but leaves the submission as an
  # uncommitted draft in Partner Center (no -Commit).
  workflow_dispatch:

jobs:
  store-submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # Packaging stages the extractors: node runs the stager, the SDK
      # publishes the C# one (tools/stage-extractors.mjs).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Tag must match the release version
        shell: pwsh
        run: |
          $manifest = Get-Content packaging\msix\Package.appxmanifest -Raw
          if ($manifest -notmatch 'Version="(\d+\.\d+\.\d+)\.0"') { throw 'manifest version not found' }
          $version = $Matches[1]
          if ('${{ github.event_name }}' -eq 'push' -and "${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match manifest version $version — bump the three version surfaces first (spec/msix-store-packaging.md)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
        id: version

      - name: Install winapp CLI
        shell: pwsh
        run: winget install microsoft.winappcli --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Pack x64 (unsigned, Store signs)
        shell: pwsh
        run: .\tools\pack-msix.ps1

      - name: Pack arm64
        shell: pwsh
        run: .\tools\pack-msix.ps1 -Arch arm64

      - name: Bundle .msixupload (both architectures, one submission)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}.0"
          # A dedicated directory: msstore publish takes --inputDirectory and
          # picks its candidate from it — keep exactly one thing to find.
          New-Item -ItemType Directory upload | Out-Null
          Compress-Archive -Path packaging\msix\*.msix -DestinationPath "upload\Blastradius_$v.zip"
          Rename-Item "upload\Blastradius_$v.zip" "Blastradius_$v.msixupload"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: msix-packages
          path: |
            packaging/msix/*.msix
            upload/*.msixupload

      - name: Submit to the Store (submission API)
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if ('${{ vars.STORE_PRODUCT_ID }}' -eq '') { throw 'STORE_PRODUCT_ID repository variable is not set (the 9N... Store ID)' }
          $v = "${{ steps.version.outputs.version }}.0"
          $flags = @{ ReplacePending = $true }
          if ('${{ github.event_name }}' -eq 'push') { $flags.Commit = $true }  # dispatch = dry run, draft only
          .\tools\submit-store.ps1 -ProductId '${{ vars.STORE_PRODUCT_ID }}' -UploadZip "upload\Blastradius_$v.msixupload" @flags

  portable:
    # Install-free archives, for machines the Store cannot reach.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The staged C# extractor is published, not copied as source
      # (tools/stage-extractors.mjs).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Linux WebView deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Version from the manifest
        shell: bash
        run: |
          v=$(grep -o 'Version="[0-9]*\.[0-9]*\.[0-9]*\.0"' packaging/msix/Package.appxmanifest | head -1 | grep -o '[0-9]*\.[0-9]*\.[0-9]*')
          echo "version=$v" >> $GITHUB_OUTPUT
        id: version

      - name: Build release binaries
        run: cargo build --release -p blastradius-cli -p blastradius-app

      - name: Stage the bundle
        shell: bash
        run: |
          name=blastradius-${{ steps.version.outputs.version }}-${{ matrix.target }}
          node tools/stage-portable.mjs --out "dist/$name"             --version ${{ steps.version.outputs.version }} --target ${{ matrix.target }}
          echo "name=$name" >> $GITHUB_OUTPUT
        id: stage

      - name: Smoke-test the staged bundle
        shell: bash
        # Run the staged CLI against this repo's own workspace, from the
        # bundle rather than from target/ — proves the binaries actually run
        # and that the bundled extractors are the ones found.
        run: |
          cd "dist/${{ steps.stage.outputs.name }}"
          ./blastradius validate "$GITHUB_WORKSPACE/docs"
          ./blastradius --help 2>&1 | head -1 || true
          # The staged C# extractor must actually run from the bundle, with
          # no SDK build and no checkout in reach. Every Store build through
          # 0.5.0 shipped without it and nothing noticed.
          #
          # Forward slashes: GITHUB_WORKSPACE is a backslash path on Windows,
          # and a backslash inside a JSON string is an escape sequence, so the
          # extractor's parser rejected it (the Linux leg passed).
          fixtures="${GITHUB_WORKSPACE//\\//}/extractors/dotnet/fixtures"
          echo '{"component":"shop.backend.billing","repoRoot":"'"$fixtures"'","root":"src","include":[],"exclude":[]}' \
            | dotnet extractors/dotnet/BlastradiusExtract.dll \
            | grep -q '"schema"'

      - name: Archive (zip on Windows, tar.gz on Linux)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ steps.stage.outputs.name }}.zip" "${{ steps.stage.outputs.name }}" > /dev/null
          else
            tar -czf "${{ steps.stage.outputs.name }}.tar.gz" "${{ steps.stage.outputs.name }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publish:
    # Attaches whatever the portable job produced. Deliberately not dependent
    # on store-submit: the Store is one channel, not the gate for the others.
    needs: portable
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1             || gh release create "${{ github.ref_name }}"                  --title "Blastradius ${{ github.ref_name }}"                  --notes "Portable builds — unzip and run, no installer and no admin rights. On Windows the Microsoft Store edition updates itself and is the better choice where the Store is available. See README.txt inside the archive."
          gh release upload "${{ github.ref_name }}" dist/* --clobber
