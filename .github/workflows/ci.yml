# CI: the dogfood gate + the whole build.
# - validate: Phase 0 exit criterion — the real parser on docs/ (fast, every push)
# - frontend: ELK layout determinism suite (ADR-0006)
# - app: the Tauri shell compiles on all three desktop platforms (ADR-0005)
name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (unit, seeded-fault, conformance suites)
        run: cargo test -p blastradius-core -p blastradius-cli
      - name: Dogfood gate — validate docs/
        run: cargo run -p blastradius-cli -- validate docs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Layout determinism + routing + headless render suites
        run: node --test ui/tests/determinism.test.mjs ui/tests/routing.test.mjs ui/tests/render.test.mjs
      - name: Install Playwright WebKit
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: WebKit rendering gate (ADR-0011)
        run: npx playwright test
      - name: Render SVG/PNG views (spec/export.md headless path)
        # ui/mock/snapshot.json is the committed live model — regenerated on
        # every model change (the e2e suites pin against it, so drift fails CI)
        run: |
          node tools/render-views.mjs ui/mock/snapshot.json -o renders --png
          node tools/render-views.mjs ui/mock/snapshot.json -o renders/dark --theme dark --png
      - name: Upload rendered views
        uses: actions/upload-artifact@v5
        with:
          name: architecture-renders
          path: renders/
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: webkit-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Import corpus bar + export tests
        run: cargo test -p blastradius-core --test import
      - name: Build architecture.html (Phase 4 exit criterion)
        run: cargo run -p blastradius-cli -- export docs -o architecture.html
      - name: Upload model artifact
        uses: actions/upload-artifact@v5
        with:
          name: architecture-html
          path: architecture.html

  # Docs site (Phase 5): docs/ rendered by tools/build-site.mjs with the live
  # model export bundled in. The deploy step needs GitHub Pages enabled once,
  # manually: repo Settings -> Pages -> Source: "GitHub Actions".
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build live model export
        run: cargo run -p blastradius-cli -- export docs -o architecture.html
      - name: Build docs site
        run: node tools/build-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-site:
    if: github.ref == 'refs/heads/master'
    needs: site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Performance budgets (spec/sync-engine.md) — release-build contracts
        run: cargo test --release -p blastradius-core --test budgets -- --include-ignored --nocapture

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux WebView deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build desktop shell
        run: cargo build -p blastradius-app
