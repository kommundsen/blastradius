# CI: the dogfood gate + the whole build.
# - validate: Phase 0 exit criterion — the real parser on docs/ (fast, every push)
# - frontend: ELK layout determinism suite (ADR-0006)
# - app: the Tauri shell compiles on all three desktop platforms (ADR-0005)
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly macOS compile check (Mondays)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test (unit, seeded-fault, conformance suites)
        run: cargo test -p blastradius-core -p blastradius-cli
      - name: Dogfood gate — validate docs/ (drift is a hard failure here)
        # --strict-drift turns architecture drift into a build failure
        # (ADR-0019). This repo holds itself to it; for anyone else drift is
        # a warning until they opt in.
        run: cargo run -p blastradius-cli -- validate docs --strict-drift
      - name: L4 facts staleness gate (spec/l4-introspection.md)
        # Both dogfood mappings: Rust is built in; TypeScript needs node + the
        # typescript package (dev dependency).
        run: |
          npm ci
          cargo run -p blastradius-cli -- introspect docs --check
      - uses: actions/setup-dotnet@v5
        with:
          # The extractor targets net8.0; semantic mode additionally restores
          # and loads the fixture solution, so the SDK must be explicit rather
          # than whatever the runner image happens to ship.
          dotnet-version: "8.0.x"
      - name: C# extractor fixture gate (syntax bytes, semantic edge, fallback)
        run: bash extractors/dotnet/test.sh
      - name: TypeScript extractor fixture gate
        run: bash extractors/typescript/test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Globbed, not listed. The list was hand-maintained and had fallen two
      # suites behind: menu.test.mjs (the gate that fails the build when a sync
      # operation is neither offered on the box nor excused) and drift.test.mjs
      # both shipped in 0.9.0 and had never run here.
      - name: Node suites — layout, routing, render, L4 derivation, mock/engine contract
        run: node --test ui/tests/*.test.mjs
      - name: Install Playwright WebKit
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: WebKit rendering gate (ADR-0011)
        run: npx playwright test --project=webkit
      - name: Render SVG/PNG views (spec/export.md headless path)
        # ui/mock/snapshot.json is the committed live model — regenerated on
        # every model change (the e2e suites pin against it, so drift fails CI)
        run: |
          node tools/render-views.mjs ui/mock/snapshot.json -o renders --png
          node tools/render-views.mjs ui/mock/snapshot.json -o renders/dark --theme dark --png
      - name: Upload rendered views
        uses: actions/upload-artifact@v7
        with:
          name: architecture-renders
          path: renders/
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Import corpus bar + export tests
        run: cargo test -p blastradius-core --test import
      - name: Build architecture.html (Phase 4 exit criterion)
        run: cargo run -p blastradius-cli -- export docs -o architecture.html
      # The exported file is a different artifact from the app — the same
      # modules concatenated into one classic script, no imports, no IPC — and
      # nothing exercised it, which is how it shipped without code level (L4)
      # at all. It runs here rather than in `frontend` because only this job
      # has the Rust toolchain that produces the file.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Exported-viewer gate (WebKit, from file://)
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npx playwright test --project=export
      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: architecture-html
          path: architecture.html

  # Docs site (Phase 5): docs/ rendered by tools/build-site.mjs with the live
  # model export bundled in. Build-only: Pages publishing was dropped
  # 2026-08-23 (owner decision) — the artifact upload keeps the site
  # inspectable per run, and re-adding a deploy job is a paste away if
  # hosting is ever wanted again.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build live model export
        run: cargo run -p blastradius-cli -- export docs -o architecture.html
      - name: Build docs site
        run: node tools/build-site.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Performance budgets (spec/sync-engine.md) — release-build contracts
        run: cargo test --release -p blastradius-core --test budgets -- --include-ignored --nocapture

  # The install-shaped hole. Three releases in a row shipped a bug that exists
  # only in an installed layout — extractors missing from the package (0.6.0),
  # the scaffold refusing a repo that already had a README (0.6.1), the C#
  # extractor unloadable from WindowsApps (0.6.2) — because CI built the
  # package every time and never ran anything out of it.
  #
  # This stages the shipping layout (binary + extractors beside it), denies
  # write on it the way an install directory is, and runs the flow a new user
  # takes: init on a repo that already has files, validate, then both
  # out-of-process extractors. Only the CLI is built: the app binary is
  # compiled by the `app` job and the smoke does not drive a window.
  installed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build the shipping CLI
        run: cargo build --release -p blastradius-cli
      - name: Stage the install layout
        shell: pwsh
        run: |
          npm ci
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/release/blastradius.exe bundle/
          node tools/stage-extractors.mjs --out bundle
      - name: Install-layout smoke (writable)
        shell: pwsh
        run: ./tools/smoke-install.ps1 -Cli bundle/blastradius.exe
      - name: Install-layout smoke (read-only, the 0.6.2 path)
        shell: pwsh
        run: ./tools/smoke-install.ps1 -Cli bundle/blastradius.exe -ReadOnly

  # The same gate for the *app*, which has never had one (0.10.0 item 3).
  #
  # The e2e suite runs against the mock bridge (ADR-0011) and is blind to the
  # whole IPC boundary by construction, so everything app-side since 0.6.2 —
  # three sync operations and `introspect_component` among them — has shipped
  # with no exercise outside a mock that answers "needs the real app". This
  # launches the shipping binary at a repository it has never seen, attaches to
  # its WebView2 over CDP (the technique that found the 0.6.1 scaffold bug by
  # hand), and walks a new user's flow: take the offer, render a model, edit
  # it, and run the staged TypeScript extractor from the install.
  #
  # Windows only: WebView2 is the engine with a debugging port. WebKitGTK has
  # no equivalent, which is the same reason ADR-0011 exists.
  installed-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build the shipping binaries
        run: cargo build --release -p blastradius-app -p blastradius-cli
      - name: Install Playwright (CDP client only — no browser download)
        run: npm ci
      - name: Drive the packaged app from an install layout
        shell: pwsh
        run: ./tools/smoke-app.ps1
      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-smoke-failure
          path: app-smoke-failure.png
          if-no-files-found: ignore

  # macOS is deliberately absent from the per-push matrix: macOS minutes
  # bill at 10x on a private repo, macOS distribution is deferred (roadmap),
  # and the compile check ran out the 2026-08 Actions quota. The app-macos
  # job below covers it on demand and weekly.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux WebView deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build desktop shell
        run: cargo build -p blastradius-app

  app-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop shell (macOS)
        run: cargo build -p blastradius-app
