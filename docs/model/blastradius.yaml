# The Blastradius desktop application.
system: blastradius
name: Blastradius
description: Local-first desktop app for interactive, git-versioned C4 architecture models.

containers:
  shell:
    name: App Shell
    tech: Tauri 2
    description: Window, menus, packaging, updates; hosts the WebView and the Core; owns the IPC boundary (ADR-0005).
    components:
      window:
        description: "Native window, welcome screen, File-Open dialog, workspace switching."
        name: "Window & Lifecycle"
      ipc-bridge:
        description: The command handlers bridging WebView invoke/events to the core library (ADR-0005).
        tech: Tauri 2
        name: IPC Bridge
      watcher:
        description: "External-edit detection (workspace files + git metadata); feeds the sync engine's single inbound path; echo suppression by content hash."
        tech: notify
        name: File Watcher

  ui:
    name: Canvas UI
    tech: WebView · design system
    description: All rendering and interaction. Owns no domain state; every edit is proposed to the Core as a transaction.
    components:
      canvas:
        name: Canvas
        tech: SVG + DOM camera layer
        description: Zooming diagram surface — nodes, edges, diff states, continuous L1→L4 camera.
        source:            # L4 dogfood: the canvas's real module graph (spec/l4-introspection.md)
          language: typescript
          root: ui/js
      yaml-panel:
        name: YAML Panel
        tech: plain-text editor (v1)
        description: In-app source editor with inline validation; a peer surface to the canvas, not a viewer. CodeMirror upgrade is Phase 5 polish.
      docs-panel:
        name: Docs Panel
        tech: markdown renderer
        description: Renders typed documents; element ↔ document navigation (ADR-0010).
      layout-worker:
        name: Layout Worker
        tech: elkjs · web worker
        description: Deterministic layered layout with pinning constraints and stability hints (ADR-0006).

  cli:
    name: CLI
    tech: Rust
    description: "`blastradius init/validate/diff/export/import` — the headless attachment point for CI (ADR-0005); enforces the dogfood gate on this folder."
    components:
      mcp-server:
        name: MCP Server
        tech: Rust
        description: "`blastradius mcp` — newline-delimited JSON-RPC over stdio (ADR-0012). Task-shaped read tools (blast_radius, element, model_diff, doc) plus writes routed through the sync engine's format-preserving splices."

  core:
    name: Core
    tech: Rust
    description: The domain. Library-first — the CLI and CI attach here without a WebView.
    components:
      model-service:
        group: Model
        source:            # owns the parse/validate half of the model
          language: rust
          root: crates/blastradius-core/src
          include: [model.rs, parse.rs, validate.rs, views.rs, manifest.rs]
        name: Model Service
        description: Workspace loading, schema parse and validation, doc registry, semantic model diff (spec/model-format.md).
      sync-engine:
        group: Model
        source:
          language: rust
          root: crates/blastradius-core/src
          include: [sync.rs, splice.rs, journal.rs]
        name: Sync Engine
        description: Arbiter between canvas, panel, and external editors; CST-preserving writes, staleness, shared undo (ADR-0008).
      git-service:
        name: Git Service
        tech: git2 / libgit2
        description: "Repository access — status, revision materialisation for diff, conflict stages, history (ADR-0007); applies in-app conflict resolutions as splices on the chosen side, staged via the user's own git (ADR-0015)."
        source:            # L4 dogfood via the built-in Rust extractor; include globs exercised on purpose
          language: rust
          root: crates/blastradius-core/src
          include: [git.rs, resolve.rs]
      exporter:
        group: Interop
        name: Exporter
        description: "Self-contained HTML snapshot and SVG/PNG assembly, all headless-capable for CI (ADR-0009); the PR diff bot renders through the same pipeline."
      importer:
        group: Interop
        name: Structurizr Importer
        description: One-way DSL import with fidelity report (ADR-0002).
      introspector:
        name: L4 Introspector
        tech: syn · external extractors
        description: "Derives read-only code-level elements from `source:`-mapped components (ADR-0016): built-in Rust extraction, out-of-process TypeScript/C# extractors over a common facts schema, committed under model/derived/ with a staleness digest."

relations:
  - from: architect
    to: ui
    label: models the system
  - from: reviewer
    to: blastradius
    label: reads exported HTML & PR diffs
  - from: ui.canvas
    to: core.sync-engine
    label: edit operations
    protocol: Tauri IPC
  - from: ui.yaml-panel
    to: core.sync-engine
    label: buffer updates
    protocol: Tauri IPC
  - from: ui.docs-panel
    to: core.model-service
    label: doc queries
    protocol: Tauri IPC
  - from: cli
    to: core.model-service
    label: validate · diff
    protocol: library call
  - from: ui.canvas
    to: ui.layout-worker
    label: layout requests
    protocol: postMessage
  # Direction corrected 2026-08-25 after drift detection (ADR-0019) found no
  # code behind the old model-service -> sync-engine edge: sync.rs imports the
  # model types, so the dependency runs this way. The old edge described the
  # data flow, which is not what a relation means here.
  - from: core.sync-engine
    to: core.model-service
    label: reads the parsed model
  # Both found as undeclared code dependencies by the same pass.
  - from: core.git-service
    to: core.model-service
    label: reads model types
  - from: core.git-service
    to: core.sync-engine
    label: rebuilds files through the splice primitives
  - from: core.sync-engine
    to: git-repo
    label: reads & writes workspace files
    protocol: fs
  - from: core.git-service
    to: git-repo
    label: status · blobs · history
    protocol: libgit2
  - from: core.introspector
    to: git-repo
    label: reads mapped source trees
    protocol: fs
  - from: external-editor
    to: git-repo
    label: concurrent edits
    direction: both
  - from: core.importer
    to: structurizr-workspace
    label: one-way import
  - from: cli.mcp-server
    to: core.sync-engine
    label: applies operations through
  - from: cli
    to: core.exporter
    label: export command
  - from: core.exporter
    to: core.model-service
    label: sealed snapshot of the model
  - from: cli
    to: core.importer
    label: import command
  - from: shell.watcher
    to: core.sync-engine
    label: external change events
  - from: ui.canvas
    to: shell.ipc-bridge
    label: invoke commands
    protocol: Tauri IPC
  - from: shell.ipc-bridge
    to: core.model-service
    label: "snapshots, operations, git queries"
  - from: shell.window
    to: ui
    label: hosts the WebView
  - from: cli
    to: core.git-service
    label: gitdiff command
  - from: shell.ipc-bridge
    to: core.git-service
    label: "status, history, time-travel"
