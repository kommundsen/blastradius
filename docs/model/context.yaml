# People and external systems — the context Blastradius operates in.
people:
  architect:
    name: Platform Architect
    description: Owns architecture documentation for their team; models systems, reviews model PRs, presents exports.
  reviewer:
    name: Reviewer
    description: Reads model diffs in PRs and exported HTML; may never install the app.

external:
  git-repo:
    name: Git Repository
    description: The team's repo. Holds the workspace; carries history, branches, and merge conflicts. Written only by the user's own git tooling (ADR-0007).
  external-editor:
    name: External Editor
    description: VS Code, vim, anything. Edits workspace files concurrently with the app; reconciled by the sync engine.
  structurizr-workspace:
    name: Structurizr Workspace
    description: Existing Structurizr DSL model; one-way import source (ADR-0002).
  coding-agent:
    description: "Claude Code, Copilot, Cursor, Codex. Reads and edits the model through the MCP server; registered project-scoped by blastradius init (ADR-0012)."
    name: Coding Agent
relations:
  - from: coding-agent
    to: blastradius.cli.mcp-server
    label: "queries & edits the model via"
    protocol: MCP/stdio
  - from: architect
    to: blastradius.shell.window
    label: "launches, opens workspaces"
